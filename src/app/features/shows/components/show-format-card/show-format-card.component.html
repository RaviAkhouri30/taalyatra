@let card = format();
<article class="scard">
  <img
    class="art"
    [ngSrc]="card.image.src"
    [width]="card.image.width"
    [height]="card.image.height"
    alt=""
  />
  <span class="sico"><app-icon [name]="card.icon" [size]="22" [strokeWidth]="1.9" /></span>
  <h3 class="d">{{ card.title }}</h3>
  <p>{{ card.text }}</p>
  <dl class="sspec">
    @for (spec of card.specs; track spec.label) {
      <div>
        <dt>{{ spec.label }}</dt>
        <dd>{{ spec.value }}</dd>
      </div>
    }
  </dl>
</article>
