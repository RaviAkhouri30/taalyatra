@if (model.data(); as page) {
  <app-auth-card [brand]="page.brand" [heading]="page.home.heading" [lead]="page.home.lead">
    <p class="who">
      {{ page.home.signedInAs }} <b>{{ model.email() }}</b>
    </p>
    <div class="actions">
      <a appButton [variant]="ghost" [routerLink]="home">{{ page.home.viewSite }}</a>
      <button appButton type="button" [disabled]="model.signingOut()" (click)="model.signOut()">
        {{ model.signingOut() ? page.home.signingOut : page.home.signOut }}
      </button>
    </div>
  </app-auth-card>
}
