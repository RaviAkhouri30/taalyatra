<div
  class="aa-frame"
  [class.aa-frame--writing]="model.busy()"
  [class.aa-frame--open]="menuOpen()"
  [class.aa-frame--landed]="model.undo() !== null"
>
  <ng-content />
  @if (shown()) {
    <button
      #chip
      type="button"
      class="aa-chip"
      aria-haspopup="menu"
      aria-label="AI help"
      [attr.aria-describedby]="forId()"
      [attr.aria-expanded]="menuOpen()"
      [disabled]="model.busy()"
      (click)="toggleMenu()"
    >
      <app-ai-spark class="aa-spark" />
      <span class="aa-word" aria-hidden="true">{{ offer().word }}</span>
      <kbd class="aa-key" aria-hidden="true">{{ shortcut }}</kbd>
    </button>
    @if (menuOpen()) {
      <app-ai-menu
        label="AI help"
        [describedBy]="forId()"
        [heading]="offer().heading"
        [choices]="offer().choices"
        (chosen)="choose($event)"
        (closed)="closeMenu()"
      />
    }
  }
</div>
@if (shown()) {
  <span class="visually-hidden" [id]="forId()">{{ forText() }}</span>
  <p class="visually-hidden" role="status">{{ announcement() }}</p>
  @if (model.error(); as error) {
    <p class="aa-error" role="alert">
      {{ error }}
      <button type="button" class="aa-link" (click)="model.tryAgain()">Try again</button>
    </p>
  }
  @if (model.busy() || model.suggestion() !== null) {
    <app-ai-suggestion
      [text]="model.busy() ? null : model.suggestion()"
      [label]="asked()"
      [yours]="yours()"
      [maxLength]="maxLength()"
      (used)="use(model.suggestion())"
      (retried)="model.tryAgain()"
      (discarded)="discard()"
    />
  }
  @if (model.undo() !== null) {
    <p class="aa-undo">
      <app-ai-spark [size]="14" />
      Written with AI.
      <button type="button" class="aa-link" (click)="undo()">Undo</button>
    </p>
  }
}
