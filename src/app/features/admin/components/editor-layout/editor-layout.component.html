<div class="ed" [class.ed--collapsed]="nav.collapsed()" [class.ed--drawer]="nav.drawerOpen()">
  <header class="ed-top">
    <app-editor-top-bar (menuToggled)="toggleDrawer()" />
  </header>
  <div class="ed-body">
    @if (nav.drawerOpen()) {
      <button
        type="button"
        class="ed-backdrop"
        aria-label="Close menu"
        (click)="closeDrawer()"
      ></button>
    }
    <div class="ed-side" id="ed-side">
      <div class="ed-side-head">
        <button
          type="button"
          class="ed-collapse"
          [attr.aria-expanded]="!nav.collapsed()"
          [attr.aria-label]="nav.collapsed() ? 'Expand menu' : 'Collapse menu'"
          [attr.title]="nav.collapsed() ? 'Expand menu' : 'Collapse menu'"
          (click)="nav.toggleCollapsed()"
        >
          <app-icon
            [name]="nav.collapsed() ? icons.ChevronsRight : icons.ChevronsLeft"
            [size]="18"
          />
        </button>
        <button type="button" class="ed-close" aria-label="Close menu" (click)="closeDrawer()">
          <app-icon [name]="icons.Close" [size]="18" />
        </button>
      </div>
      <nav #sideNav class="ed-nav" aria-label="Editor">
        @for (group of groups; track group.id) {
          <div class="ed-group">
            @if (group.label) {
              <p class="ed-group-label" [id]="group.id">{{ group.label }}</p>
            }
            <ul [attr.aria-labelledby]="group.label ? group.id : null">
              @for (link of group.links; track link.url) {
                <li>
                  <a
                    [routerLink]="link.url"
                    routerLinkActive="sel"
                    [routerLinkActiveOptions]="link.match"
                    ariaCurrentWhenActive="page"
                    [attr.title]="nav.collapsed() ? link.label : null"
                    (click)="nav.closeDrawer()"
                  >
                    <app-icon [name]="link.icon" [size]="19" />
                    <span class="ed-label">{{ link.label }}</span>
                    @if (link.showsCount && model.changeCount() > 0) {
                      <span class="count"
                        >{{ model.changeCount() }}<span class="sr"> unpublished</span></span
                      >
                    }
                  </a>
                </li>
              }
            </ul>
          </div>
        }
      </nav>
    </div>
    <div class="ed-main">
      <router-outlet />
    </div>
  </div>
</div>
