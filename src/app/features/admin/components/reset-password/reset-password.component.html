@if (model.data(); as page) {
  <app-auth-card [brand]="page.brand" [heading]="page.reset.heading" [lead]="page.reset.lead">
    @if (model.sent()) {
      <p class="lok" role="status">{{ page.reset.sent }}</p>
    } @else {
      <form class="lform" [formGroup]="model.form" (ngSubmit)="model.submit()" novalidate>
        <label class="fld"
          ><span>{{ page.signIn.emailLabel }}</span>
          <input
            class="inp2"
            type="email"
            inputmode="email"
            formControlName="email"
            autocomplete="username"
            required
            [attr.maxlength]="emailMax"
            [placeholder]="page.signIn.emailPlaceholder"
            [attr.aria-invalid]="showError()"
            [attr.aria-describedby]="showError() ? 'reset-email-error' : null"
          />
          @if (showError()) {
            <small class="err" id="reset-email-error">{{
              page.emailError(model.form.controls.email.errors)
            }}</small>
          }
        </label>
        @if (model.failure(); as kind) {
          <p class="lerr" role="alert">{{ page.messageFor(kind) }}</p>
        }
        <button appButton type="submit" [disabled]="model.submitting()">
          {{ model.submitting() ? page.reset.submitting : page.reset.submit }}
        </button>
      </form>
    }
    <div class="lrow">
      <a class="llink" [routerLink]="signInRoute">{{ page.reset.backToSignIn }}</a>
    </div>
  </app-auth-card>
}
