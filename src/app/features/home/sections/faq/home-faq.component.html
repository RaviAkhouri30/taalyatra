@if (model.data(); as section) {
  <section class="sec" [id]="anchor">
    <div class="wrap two">
      <div>
        <p class="eyebrow">{{ section.eyebrow }}</p>
        <h2 class="d h2 title">{{ section.title }}</h2>
      </div>
      <div class="faq">
        @for (item of section.items; track item.question) {
          <details [open]="item.open">
            <summary>{{ item.question }}</summary>
            <p>{{ item.answer }}</p>
          </details>
        }
      </div>
    </div>
  </section>
}
