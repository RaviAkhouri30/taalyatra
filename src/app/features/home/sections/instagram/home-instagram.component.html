@if (model.data(); as section) {
  <section class="sec" [id]="anchor">
    <div class="wrap">
      <app-section-header [eyebrow]="section.eyebrow" [title]="section.title">
        <a appButton [variant]="buttonVariant.Ghost" [href]="section.profileUrl">
          <app-icon [name]="instagramIcon" [size]="18" />
          {{ section.followLabel }}
        </a>
      </app-section-header>
      <div class="iggrid">
        @for (post of section.posts; track post.image.src) {
          <a class="igc" [href]="post.url" [attr.aria-label]="section.postLabel">
            <span class="igthumb">
              <img [ngSrc]="post.image.src" fill alt="" />
              <span class="igbadge"><app-icon [name]="instagramIcon" [size]="18" /></span>
            </span>
            <p>{{ post.caption }}</p>
          </a>
        }
      </div>
    </div>
  </section>
}
