@let chat = assistant();
<div class="fab" [class.open]="open()">
  @if (!open() && !hasOpened()) {
    <div class="tease" aria-hidden="true">{{ chat.tease }}</div>
  }
  <!-- Hidden behind the open panel: out of the tab order and the accessibility tree too. -->
  <a
    class="fabb call"
    [href]="chat.callHref"
    [attr.aria-label]="chat.labels.call"
    [attr.tabindex]="open() ? -1 : null"
    [attr.aria-hidden]="open() || null"
    ><app-icon [name]="icon.Phone" [size]="26"
  /></a>
  <a
    class="fabb wa"
    [href]="chat.whatsAppHref"
    [attr.aria-label]="chat.labels.whatsApp"
    [attr.tabindex]="open() ? -1 : null"
    [attr.aria-hidden]="open() || null"
    ><app-icon [name]="icon.WhatsApp" [size]="28"
  /></a>
  <button
    #toggle
    class="fabb chatb"
    type="button"
    [class.open]="open()"
    [attr.aria-label]="chat.labels.toggle"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId()"
    (click)="onToggle()"
  >
    <svg
      class="ic-d"
      width="30"
      height="30"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <ellipse class="rpA" cx="12" cy="9" rx="7" ry="2.2" />
      <ellipse cx="12" cy="9" rx="7" ry="2.2" />
      <path d="M5 9c.3 3 2 5 3 6l-1 5h10l-1-5c1-1 2.7-3 3-6" />
      <path d="M8 11l2 7M12 11.5v7M16 11l-2 7" />
      <path class="sl" d="M3 2.5l5 4" />
      <path class="sr" d="M21 2.5l-5 4" />
    </svg>
    <svg
      class="ic-x"
      width="26"
      height="26"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.4"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M5 5l14 14M19 5L5 19" />
    </svg>
    @if (!hasOpened()) {
      <i class="badge"></i>
    }
  </button>
</div>
