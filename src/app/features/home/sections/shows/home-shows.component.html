@if (model.data(); as section) {
  <section class="sec shows" [id]="anchor">
    <div class="wrap">
      <app-section-header [eyebrow]="section.eyebrow" [title]="section.title">
        @if (section.showsPage; as showsPage) {
          <a appButton [variant]="buttonVariant.Ghost" [routerLink]="showsPage.route">{{
            showsPage.label
          }}</a>
        }
      </app-section-header>
      <p class="lead">{{ section.lead }}</p>
      @if (section.spotlight; as spotlight) {
        <app-show-spotlight class="spotlight" [spotlight]="spotlight" />
      }
      <div class="showgrid">
        @for (format of section.formats; track format.title) {
          <!-- With the Shows page switched off, the cards stay but stop being links (no href). -->
          <a class="shc" [routerLink]="section.showsPage?.route ?? null">
            <img
              [ngSrc]="format.image.src"
              [width]="format.image.width"
              [height]="format.image.height"
              alt=""
            />
            <span class="in">
              <b>{{ format.title }}</b>
              <span class="text">{{ format.text }}</span>
            </span>
          </a>
        }
      </div>
    </div>
  </section>
}
