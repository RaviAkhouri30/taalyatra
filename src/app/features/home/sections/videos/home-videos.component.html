@if (model.data(); as section) {
  <section class="sec" [id]="anchor">
    <div class="wrap">
      <div class="head">
        <div>
          <p class="eyebrow">{{ section.eyebrow }}</p>
          <h2 class="d h2 title">{{ section.title }}</h2>
        </div>
        @if (section.videosPage; as videosPage) {
          <a appButton [variant]="buttonVariant.Ghost" [routerLink]="videosPage.route">{{
            videosPage.label
          }}</a>
        }
      </div>
      <div class="vids">
        @for (card of section.cards; track card.video.title) {
          <app-video-card [video]="card.video" [ariaLabel]="card.ariaLabel" />
        }
      </div>
    </div>
  </section>
}
