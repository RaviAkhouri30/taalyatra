<div class="promo">
  <span class="fx" aria-hidden="true">
    <span class="burst"></span><span class="burst"></span>
    @for (slot of sparks; track slot) {
      <span class="cspark"></span>
    }
  </span>
  <a class="promo-l" [routerLink]="promotion().link.route" [fragment]="promotion().link.fragment">
    <span class="promo-ico"><app-diya-icon [palette]="diya" /></span>
    <b>{{ promotion().link.label }}</b>
  </a>
  <button
    class="promo-x"
    type="button"
    [attr.aria-label]="promotion().dismissLabel"
    (click)="dismiss.emit()"
  >
    &times;
  </button>
</div>
