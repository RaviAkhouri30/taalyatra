<p class="eyebrow heading">Visit us</p>
<a class="fmap" [href]="contact().mapsUrl" [attr.aria-label]="mapLabel()">
  <svg viewBox="0 0 280 150" role="img" aria-label="Small map showing our location">
    <rect width="280" height="150" fill="#241C17" />
    <g stroke="#4A3A2C" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M-5 46 L285 70" />
      <path d="M-5 118 L285 100" />
      <path d="M86 -5 L112 155" />
      <path d="M196 -5 L178 155" />
    </g>
    <g stroke="#3A2E25" stroke-width="4" fill="none">
      <path d="M0 20 L280 34" />
      <path d="M0 140 L280 132" />
      <path d="M40 0 L50 150" />
      <path d="M240 0 L231 150" />
    </g>
    <path
      d="M140 40 C122 40 110 54 110 69 C110 90 140 118 140 118 C140 118 170 90 170 69 C170 54 158 40 140 40Z"
      fill="#E9A552"
      stroke="#171210"
      stroke-width="3"
    />
    <circle cx="140" cy="69" r="10" fill="#171210" />
  </svg>
  <span>Open in Maps</span>
</a>
<dl class="fdl">
  <dt>Name</dt>
  <dd>
    {{ contact().businessName }}<br /><span [attr.lang]="contact().localName.lang">{{
      contact().localName.text
    }}</span>
  </dd>
  <dt>Address</dt>
  <dd>
    @if (labels().copyAddress) {
      <app-copy-text
        [text]="contact().address"
        [action]="labels().copyAddress"
        [copied]="labels().addressCopied"
        [failed]="labels().copyFailed"
      />
    } @else {
      {{ contact().address }}
    }
  </dd>
  <dt>Phone</dt>
  <dd>
    <a class="inline" [href]="telHref()" [attr.aria-label]="callLabel()">{{ callText() }}</a>
  </dd>
  <dt>Email</dt>
  <dd>
    <a class="inline" [href]="mailHref()">{{ contact().email }}</a>
  </dd>
  <dt>Hours</dt>
  <dd>{{ contact().hours }}</dd>
  <dt>Plus code</dt>
  <dd>{{ contact().plusCode }}</dd>
</dl>
<a class="directions" [href]="contact().directionsUrl">Get directions</a>
