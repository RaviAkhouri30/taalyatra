<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Taal Yatra — Drum Circle</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Drum circles and music workshops for teams, families and fun-seekers in Pune."
    />
    <!-- Link previews (WhatsApp, LinkedIn, Facebook) read only static HTML, so these defaults live
         here; %SITE_URL% is filled in by scripts/postbuild.mjs. SeoService updates the per-page
         values (description, canonical, og:url) after the app starts. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Taal Yatra" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Taal Yatra — Drum circles and music workshops in Pune" />
    <meta
      property="og:description"
      content="Drum circles, music workshops and live shows for teams, families and festivals in Pune."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/images/og/taal-yatra.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Taal Yatra: find your rhythm, share the beat" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Taal Yatra — Drum circles and music workshops in Pune" />
    <meta
      name="twitter:description"
      content="Drum circles, music workshops and live shows for teams, families and festivals in Pune."
    />
    <meta name="twitter:image" content="%SITE_URL%/images/og/taal-yatra.jpg" />
    <meta name="theme-color" content="#171210" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Warm up font and image CDN connections early for a faster first paint (CLAUDE.md §10). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <!-- Same families and weights as the design prototype; production builds inline this CSS. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap"
    />
    <!-- Firebase web config, written at deploy time (git-ignored; CLAUDE.md §10). A classic script,
         so it runs before the app's module scripts. Development on the Fake backend ignores it. -->
    <script src="runtime-config.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
