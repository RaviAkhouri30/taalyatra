# SonarQube configuration (CLAUDE.md §10). Run with: npm run sonar
# Provide SONAR_HOST_URL and SONAR_TOKEN as environment variables — never commit the token.
sonar.projectKey=taal-yatra
sonar.projectName=Taal Yatra
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,e2e
sonar.test.inclusions=src/**/*.spec.ts,e2e/**/*.ts
sonar.exclusions=**/node_modules/**,**/*.spec.ts,src/environments/**
sonar.coverage.exclusions=src/main.ts,src/**/*.routes.ts,src/app/app.config.ts,src/environments/**,e2e/**

sonar.javascript.lcov.reportPaths=coverage/taal-yatra/lcov.info
sonar.eslint.reportPaths=reports/eslint-report.json
sonar.qualitygate.wait=true
