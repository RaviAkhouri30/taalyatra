<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Animation of two hands playing a djembe drum, with small drums, music notes, sparks and sound bars">
<style>.hl,.hr{animation:hit 1.2s ease-in infinite}.hr{animation-delay:.6s}.hl,.hr{transform-origin:200px 200px}@keyframes hit{0%{transform:translateY(-95px) rotate(-7deg)}13%{transform:translateY(0) rotate(0) scaleY(.96)}22%{transform:translateY(-16px) rotate(-2deg)}45%,100%{transform:translateY(-95px) rotate(-7deg)}}.fl{animation:flash 1.2s ease-out infinite}.fr{animation:flash 1.2s ease-out .6s infinite}@keyframes flash{0%{opacity:0}13%{opacity:.9}45%,100%{opacity:0}}.rp{transform-origin:300px 300px;animation:rip 1.2s ease-out infinite;opacity:0}.rp.b{animation-delay:.6s}@keyframes rip{0%,12%{transform:scale(.95);opacity:0}13%{transform:scale(1);opacity:.95}100%{transform:scale(2);opacity:0}}.thump{animation:th .6s ease-out infinite}@keyframes th{0%{transform:translateY(0)}13%{transform:translateY(6px)}30%,100%{transform:translateY(0)}}.note{animation:rise 3.6s ease-out infinite;opacity:0}@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-210px) scale(1.05);opacity:0}}.arc{animation:arc .6s ease-in-out infinite alternate}@keyframes arc{from{opacity:.15}to{opacity:.85}}.spin{transform-origin:300px 300px;animation:sp 40s linear infinite}.spin2{transform-origin:300px 300px;animation:sp 60s linear infinite reverse}@keyframes sp{to{transform:rotate(360deg)}}.eqb rect{transform-box:fill-box;transform-origin:50% 100%;animation:eq .6s ease-in-out infinite alternate}@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}.spk{transform-box:fill-box;transform-origin:center;animation:spk 1.2s ease-out infinite;opacity:0}.spk.b{animation-delay:.6s}@keyframes spk{0%,12%{transform:scale(.2);opacity:0}13%{transform:scale(.6);opacity:1}38%{transform:scale(1.6);opacity:0}100%{opacity:0}}.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}@keyframes tw{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1);opacity:1}}.bg1{animation:bong 1.2s ease-out .3s infinite}.bg2{animation:bong 1.2s ease-out .9s infinite}@keyframes bong{0%{transform:translateY(0)}8%{transform:translateY(7px)}22%,100%{transform:translateY(0)}}.glowp{animation:gp .6s ease-out infinite}@keyframes gp{0%{opacity:.7}13%{opacity:1}100%{opacity:.7}}.rays{animation:rays 2.4s ease-in-out infinite alternate}@keyframes rays{from{opacity:.35}to{opacity:1}}.shadow{transform-box:fill-box;transform-origin:center;animation:sh .6s ease-out infinite}@keyframes sh{0%{transform:scaleX(1)}13%{transform:scaleX(1.06)}30%,100%{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
