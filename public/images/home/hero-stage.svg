<radialGradient id="gGlow" cx="50%" cy="52%" r="50%"><stop offset="0" stop-color="#E9A552" stop-opacity=".55"/><stop offset="1" stop-color="#E9A552" stop-opacity="0"/></radialGradient>
<linearGradient id="gSkin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8B493"/><stop offset=".55" stop-color="#D49A78"/><stop offset="1" stop-color="#B97B5A"/></linearGradient>
<linearGradient id="gBody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5E2F14"/><stop offset=".45" stop-color="#B26A35"/><stop offset="1" stop-color="#58290F"/></linearGradient>
<radialGradient id="gHead" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#FFF3D9"/><stop offset="1" stop-color="#D9C096"/></radialGradient>
