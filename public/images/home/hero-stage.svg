<g id="nt"><ellipse cx="0" cy="0" rx="11" ry="8" fill="#E9A552" transform="rotate(-20)"/><rect x="8" y="-34" width="4" height="34" fill="#E9A552"/><path d="M12 -34 q16 6 12 22" stroke="#E9A552" stroke-width="4" fill="none"/></g>
<g id="bongo"><path d="M-42 0 C-38 38 -32 58 -28 74 L28 74 C32 58 38 38 42 0Z" fill="url(#gBody)"/><rect x="-36" y="40" width="72" height="9" fill="#E9A552"/><ellipse cx="0" cy="0" rx="44" ry="11" fill="#3b2314"/><ellipse cx="0" cy="-1" rx="39" ry="8.5" fill="url(#gHead)"/></g>
